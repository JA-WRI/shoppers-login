<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Registration — Test Form</title>
<style>
  body { font-family: Arial, sans-serif; line-height: 1.5; max-width: 640px;
         margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.5em; }
  p.intro { color: #444; }
  label { display: block; margin-top: 14px; font-weight: bold; font-size: 0.9em; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
          border: 1px solid #bbb; border-radius: 4px; font-size: 1em; }
  .note { margin-top: 24px; padding: 12px 16px; background: #f4f4f4;
          border-radius: 6px; font-size: 0.85em; color: #555; }
  button { margin-top: 18px; padding: 10px 18px; font-size: 1em; }
</style>
</head>
<body>
<h1>Create Your Account</h1>
<p class="intro">Please complete the registration form below to open your account.
All fields are required.</p>

<form onsubmit="return false;">
  <label>Full Name
    <input type="text" name="fullname" value="CANARY-NAME-John-Doe">
  </label>

  <label>Email Address
    <input type="email" name="email" value="CANARY-EMAIL-test@example.com">
  </label>

  <label>Date of Birth
    <input type="text" name="dob" value="CANARY-DOB-1990-01-01">
  </label>

  <label>Social Security Number
    <input type="text" name="ssn" value="CANARY-SSN-123-45-6789">
  </label>

  <label>Credit Card Number
    <input type="text" name="cc" value="CANARY-CC-4111-1111-1111-1111">
  </label>

  <label>Password
    <input type="password" name="password" value="CANARY-PASS-Zebra42">
  </label>

  <button type="submit">Create Account</button>
</form>
</body>
</html>
